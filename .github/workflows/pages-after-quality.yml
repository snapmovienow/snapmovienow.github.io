name: Pages after Quality
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: pages-after-quality
  cancel-in-progress: false
jobs:
  deploy:
    # Enable only after the owner changes Pages Source to GitHub Actions.
    if: >-
      vars.PAGES_ACTIONS_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reject a superseded publication
        env:
          SNAP_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SNAP_DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$SNAP_DEPLOY_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: artifacts/pages
      - name: Publish tested frontend
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
